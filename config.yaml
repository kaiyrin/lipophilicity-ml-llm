data:
  url: https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/Lipophilicity.csv #https://github.com/deepchem/deepchem/blob/master/deepchem/molnet/load_function/lipo_datasets.py
  md5: 85a0e1cb8b38b0dfc3f96ff47a57f0ab     #fingerprint of the file's contents # If it doesn't match, the script only warns: the file might just have been re-exported
  smiles_col: smiles
  raw_file: data/raw/Lipophilicity.csv
  target_col: exp
  id_col: CMPD_CHEMBLID
  merge_stereo: true          # stereoisomers look identical to the features → merge
features:
  morgan_radius: 2
  morgan_bits: 1024
  desc_abs_max: 1000000         # larger |value| → NaN (exploding descriptors)
paths:
  raw: data/raw
  processed: data/processed
  reports: reports
#split+base+models+cv
cv:
  splits: [scaffold]   # scaffold = unseen chemistry
  n_splits: 5
  seeds: [0, 1, 2]             # runtime knob: use [0] for a quick first pass

models:
  ridge_alphas: [-3, 3, 12]   # np.logspace(-3, 3, 12): 0.001 … 1000
  knn_k: 5
  hgb: {max_iter: 500, learning_rate: 0.05, l2_regularization: 1.0, early_stopping: false}
  mlp: {hidden_layer_sizes: [256, 128], alpha: 0.01, learning_rate_init: 0.001,
        batch_size: 64, max_iter: 200, early_stopping: true, n_iter_no_change: 15}

bootstrap:
  n_boot: 2000        # resampling rounds
  seed: 0             # bootstrap RNG seed, separate from cv.seeds

  